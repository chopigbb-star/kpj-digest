name: 기사 수집·요약

# 평소에는 맥미니(scripts/run-mac.sh)가 4시간마다 실행한다.
# 이 워크플로는 맥미니가 안 될 때 쓰는 예비용 (Actions 탭에서 수동 실행, 무료 API 키 사용)
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 이미지 도구 확인
        run: command -v convert || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)

      - name: 수집·요약
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/update.mjs

      - name: 변경 사항 커밋
        run: |
          git config user.name "kpj-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "기사 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          fi
