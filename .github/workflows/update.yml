name: 기사 수집·요약

on:
  schedule:
    - cron: '17 */4 * * *' # 4시간마다 (UTC 기준)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 수집·요약
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/update.mjs

      - name: 변경 사항 커밋
        run: |
          git config user.name "kpj-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "기사 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          fi
